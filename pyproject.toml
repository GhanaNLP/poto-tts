[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "poto-tts"
version = "0.3.0"
description = "Ghanaian English speech synthesis on sherpa-onnx: several engines, one Ghanaian espeak-ng dictionary, cross-platform voice files"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "GhanaNLP" }]
keywords = ["ghana", "english", "tts", "speech-synthesis", "piper", "vits", "sherpa-onnx", "onnx", "ipa", "espeak-ng", "accent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
]
dependencies = [
    # The Ghanaian pronunciation lexicon: 104,623 words, and the source of every
    # entry in the compiled dictionary. Needed at runtime too, because a user can
    # rebuild the dictionary with their own words.
    "ghana-english-g2p>=0.1.0",
]

[project.optional-dependencies]
# Synthesis in Python. Not needed to build a dictionary, inspect pronunciations, or
# ship voice files to Android, iOS or WebAssembly -- those runtimes carry their own
# sherpa-onnx. huggingface_hub is here rather than in the base dependencies because
# it is only used to fetch a voice, and downloads go through it so they are counted
# against the model repository.
tts = ["sherpa-onnx>=1.13.3", "huggingface_hub>=0.24", "numpy>=1.21"]
# The REST server.
api = ["poto-tts[tts]", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]
# `espeak-english` bundles libespeak-ng, used to read pronunciations back for
# verification without a system espeak-ng. The espeak-ng *binary* is still required
# to compile a dictionary (`poto-tts dict`).
dev = ["poto-tts[api]", "pytest>=7", "espeak-english>=0.1.1", "onnx>=1.15"]
all = ["poto-tts[api]"]

[project.urls]
Homepage = "https://github.com/GhanaNLP/poto-tts"
Source = "https://github.com/GhanaNLP/poto-tts"
Issues = "https://github.com/GhanaNLP/poto-tts/issues"
Models = "https://huggingface.co/ghananlpcommunity/poto-tts-kokoro-gh"
Trainer = "https://github.com/OHF-voice/piper1-gpl"



[project.scripts]
poto-tts = "poto_tts.cli:_entry"

[tool.setuptools]
packages = ["poto_tts", "poto_tts.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
