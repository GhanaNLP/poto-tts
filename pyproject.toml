[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "poto-tts"
version = "0.7.0"
description = "Ghanaian English speech synthesis on sherpa-onnx: several engines, one Ghanaian espeak-ng dictionary, cross-platform voice files"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "GhanaNLP" }]
keywords = ["ghana", "english", "tts", "speech-synthesis", "piper", "vits", "sherpa-onnx", "onnx", "ipa", "espeak-ng", "accent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
]
# `pip install poto-tts` should speak, so the engine and the fetcher are base
# dependencies rather than extras. huggingface_hub is here because voices come from
# the Hub and downloads count against the repository that published them.
dependencies = [
    "sherpa-onnx>=1.13.3",
    "huggingface_hub>=0.24",
    "numpy>=1.21",
]

[project.optional-dependencies]
# Needed to *build* a dictionary (`poto-tts dict`) or inspect a pronunciation
# (`--phonemes`), not to speak: the dictionary ships compiled inside each voice.
# Depended on rather than vendored so a rebuild always uses the current lexicon, and
# kept out of the base install because espeak-english bundles libespeak-ng (GPL-3.0)
# and nobody who only wants to speak should have to take that on.
lexicon = ["ghana-english-g2p>=0.1.0", "espeak-english>=0.1.1"]
# Kept as an alias so `poto-tts[tts]` in older instructions still resolves.
tts = []
# The REST server.
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2", "python-multipart>=0.0.9"]
# `espeak-english` bundles libespeak-ng, used to read pronunciations back for
# verification without a system espeak-ng. The espeak-ng *binary* is still required
# to compile a dictionary (`poto-tts dict`).
dev = ["poto-tts[api,lexicon]", "pytest>=7", "onnx>=1.15"]
all = ["poto-tts[api,lexicon]"]

[project.urls]
Homepage = "https://github.com/GhanaNLP/poto-tts"
Source = "https://github.com/GhanaNLP/poto-tts"
Issues = "https://github.com/GhanaNLP/poto-tts/issues"
Models = "https://huggingface.co/ghananlpcommunity/poto-tts-kokoro-gh"
Trainer = "https://github.com/OHF-voice/piper1-gpl"



[project.scripts]
poto-tts = "poto_tts.cli:_entry"

[tool.setuptools]
packages = ["poto_tts", "poto_tts.backends"]

[tool.setuptools.package-data]
# The web page. Shipped in the wheel because `poto-tts serve` has to work from a
# pip install, not only from a checkout.
# The word list decides which lexicon entries the dictionary is built from, and the
# voice file is half the front-end. Without them in the wheel, `poto-tts dict` from a
# pip install would quietly build the whole lexicon and no accent -- working, and
# wrong.
poto_tts = ["static/*.html", "data/ghanaian-words.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
