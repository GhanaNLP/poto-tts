<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 290" width="980" height="290"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     fill="currentColor" role="img">
  <title>How poto-tts decides a pronunciation</title>
  <style>
    .box  { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: .5; }
    .grp  { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: .25;
            stroke-dasharray: 5 4; }
    .lbl  { font-size: 14.5px; font-weight: 600; }
    .sub  { font-size: 11.5px; opacity: .62; }
    .tag  { font-size: 10px; opacity: .45; letter-spacing: .1em; }
    .fl   { stroke: currentColor; stroke-width: 1.5; opacity: .45; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity=".45"/>
    </marker>
  </defs>

  <text class="lbl" x="14" y="146">your text</text>
  <text class="sub" x="14" y="164">unchanged</text>
  <line class="fl" x1="98" y1="141" x2="140" y2="141" marker-end="url(#ar)"/>

  <rect class="grp" x="142" y="34" width="500" height="214" rx="10"/>
  <text class="tag" x="158" y="56">ESPEAK-NG</text>

  <rect class="box" x="166" y="72" width="198" height="56" rx="7"/>
  <text class="lbl" x="182" y="96">Ghana lexicon</text>
  <text class="sub" x="182" y="114">every word it knows</text>

  <rect class="box" x="166" y="158" width="198" height="56" rx="7"/>
  <text class="lbl" x="182" y="182">letter-to-sound</text>
  <text class="sub" x="182" y="200">only what it does not</text>

  <path class="fl" d="M364,100 H400 V164" marker-end="url(#ar)"/>
  <path class="fl" d="M364,186 H436" marker-end="url(#ar)"/>

  <rect class="box" x="438" y="158" width="180" height="56" rx="7"/>
  <text class="lbl" x="454" y="182">accent rules</text>
  <text class="sub" x="454" y="200">applied to both</text>
  <text class="sub" x="438" y="106">the lexicon decides;</text>
  <text class="sub" x="438" y="123">rules may not overrule it</text>

  <line class="fl" x1="642" y1="186" x2="686" y2="186" marker-end="url(#ar)"/>
  <text class="lbl" x="692" y="182">phonemes</text>
  <line class="fl" x1="784" y1="186" x2="826" y2="186" marker-end="url(#ar)"/>
  <text class="lbl" x="832" y="182">Kokoro</text>
  <text class="sub" x="832" y="200">speaks it</text>
</svg>
