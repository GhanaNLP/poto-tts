<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     fill="currentColor" role="img">
  <title>How poto-tts decides a pronunciation</title>
  <style>
    .box  { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: .5; }
    .grp  { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: .25;
            stroke-dasharray: 5 4; }
    .lbl  { font-size: 14.5px; font-weight: 600; }
    .sub  { font-size: 11.5px; opacity: .62; }
    .tag  { font-size: 10px; opacity: .45; letter-spacing: .1em; }
    .fl   { stroke: currentColor; stroke-width: 1.5; opacity: .45; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor" opacity=".45"/>
    </marker>
  </defs>

  <text class="lbl" x="14" y="126">your text</text>
  <text class="sub" x="14" y="144">unchanged</text>
  <line class="fl" x1="98" y1="121" x2="140" y2="121" marker-end="url(#ar)"/>

  <rect class="grp" x="142" y="26" width="404" height="190" rx="10"/>
  <text class="tag" x="158" y="48">ESPEAK-NG</text>

  <rect class="box" x="168" y="64" width="230" height="56" rx="7"/>
  <text class="lbl" x="184" y="88">Ghanaian lexicon</text>
  <text class="sub" x="184" y="106">44,321 words it knows</text>

  <rect class="box" x="168" y="146" width="230" height="52" rx="7"/>
  <text class="lbl" x="184" y="170">English rules</text>
  <text class="sub" x="184" y="188">every other word</text>

  <path class="fl" d="M398,92 H452 V118" marker-end="url(#ar)"/>
  <path class="fl" d="M398,172 H452 V128" marker-end="url(#ar)"/>

  <line class="fl" x1="546" y1="121" x2="592" y2="121" marker-end="url(#ar)"/>
  <text class="lbl" x="598" y="117">phonemes</text>
  <line class="fl" x1="690" y1="121" x2="736" y2="121" marker-end="url(#ar)"/>
  <text class="lbl" x="742" y="117">Kokoro</text>
  <text class="sub" x="742" y="135">speaks it</text>
</svg>
